<body>

const q = new URLSearchParams(location.search);
const sceneName = CONFIGS[q.get('scene')] ? q.get('scene') : 'office';
let t = Math.max(0, Number(q.get('t')) || 0);
const cfg = CONFIGS[sceneName];
t = Math.min(t, cfg.duration);

document.getElementById('scene').value = sceneName;
document.getElementById('t').value = t;
document.getElementById('mark').textContent = `${sceneName} @ ${t.toFixed(2)}s / ${cfg.duration}s`;
document.title = `Scratch 3D — ${sceneName} @ ${t.toFixed(2)}s`;

// set before the module's mount() takes its initial sample
window.__hfThreeTime = cfg.absoluteStart + t;
window.__hf.buildReady[sceneName] = window.TribunalReady.then((api) => api.mount(cfg, document.getElementById('view')));
window.__hf.buildReady[sceneName].then(() => {
  document.getElementById('state').textContent = 'ready';
  seek(t);
}).catch((e) => { document.getElementById('state').textContent = 'MOUNT FAILED'; document.getElementById('err').textContent = (e && e.stack) || String(e); });

function seek(local) {
  t = Math.max(0, Math.min(cfg.duration, local));
  window.__hfThreeTime = cfg.absoluteStart + t;
  window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: window.__hfThreeTime } }));
  document.getElementById('t').value = t.toFixed(2);
  document.getElementById('mark').textContent = `${sceneName} @ ${t.toFixed(2)}s / ${cfg.duration}s`;
  document.title = `Scratch 3D — ${sceneName} @ ${t.toFixed(2)}s`;
}
document.getElementById('t').addEventListener('change', (e) => seek(Number(e.target.value)));
document.getElementById('scene').addEventListener('change', (e) => {
  const u = new URL(location); u.searchParams.set('scene', e.target.value); location = u;
});
addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.5 : 0.1;
  if (e.key === 'ArrowLeft') { seek(t - step); e.preventDefault(); }
  if (e.key === 'ArrowRight') { seek(t + step); e.preventDefault(); }
});
</script>
</body>

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test typecheck build
      - run: node tools/guards/no-media.mjs
      # TASK_2026_010+: add G2-G5, library-imports, and marketplace validation here.
      - run: npx nx run nx-video-e2e:e2e
        env:
          NX_VIDEO_E2E_NX_VERSION: 24.0.1

  e2e-nx23:
    name: e2e-nx23 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx nx run nx-video-e2e:e2e
        env:
          NX_VIDEO_E2E_NX_VERSION: 23.3.1

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: node tools/scripts/check-commits.mjs "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
